name: tests

# Runs the full pytest suite (contracts + perception + anything else under tests/) on main and on PRs into main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Extras from pyproject.toml: [perception] = numpy/scipy/onnxruntime; [train] = torch/onnx/sklearn, needed by
      # the CNN -> ONNX round-trip test (it is skipped without torch). torch comes from the CPU-only index first so
      # pip doesn't pull the multi-GB CUDA wheels; [train] then finds it already satisfied.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,perception,train]"

      # -rs lists any skipped test and why, so a missing dependency shows up in the log instead of hiding.
      - name: Run tests
        run: python -m pytest -q -rs
