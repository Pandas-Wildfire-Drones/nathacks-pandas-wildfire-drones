[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nathacks-swarm-contracts"
version = "0.1.0"
description = "Shared Pydantic contracts for the night initial-attack drone swarm (natHacks 2026, Pandas)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["contracts", "swarm"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
