[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nathacks-swarm-contracts"
version = "0.1.0"
description = "Shared Pydantic contracts for the night initial-attack drone swarm (natHacks 2026, Pandas)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# perception runtime (drone side): numpy/scipy core, onnxruntime for the ML verifier
perception = ["numpy>=1.26", "scipy>=1.11", "onnxruntime>=1.17"]
# offline training (Colab / laptop): PyTorch CNN (primary) + sklearn/skl2onnx GBM (stretch)
train = ["numpy>=1.26", "scipy>=1.11", "onnxruntime>=1.17", "torch>=2.2", "onnx>=1.15", "onnxscript",
         "scikit-learn>=1.3", "skl2onnx>=1.16", "tifffile", "imagecodecs", "pillow", "matplotlib", "ipykernel", "ipywidgets"]

[tool.setuptools.packages.find]
include = ["contracts*", "perception*", "training*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
